# database init, supports mysql too
database=h2
spring.sql.init.schema-locations=classpath*:db/${database}/schema.sql
spring.sql.init.data-locations=classpath*:db/${database}/data.sql

# Web
spring.thymeleaf.mode=HTML

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# Internationalization
spring.messages.basename=messages/messages

# Actuator
# Only the endpoints that probes and Prometheus need are exposed
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

# Login sessions are stored in the database so that every instance (and the DR site) can read them.
# The session tables are created by db/${database}/schema.sql.
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=30m

# Business time zone used for booking-open and cancellation rules
petclinic.zone=Asia/Seoul

# Logging
logging.level.org.springframework=INFO
# logging.level.org.springframework.web=DEBUG
# logging.level.org.springframework.context.annotation=TRACE

# Maximum time static resources should be cached
spring.web.resources.cache.cachecontrol.max-age=12h

# First staff account. Created at startup only when both values are set.
petclinic.staff.username=${PETCLINIC_STAFF_USERNAME:}
petclinic.staff.password=${PETCLINIC_STAFF_PASSWORD:}
