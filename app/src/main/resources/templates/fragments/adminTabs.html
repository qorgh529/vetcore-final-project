<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org">

<body>
  <th:block th:fragment="tabs (active)">
    <h1 class="vc-title" th:text="#{admin}"></h1>
    <p class="text-body-md text-on-surface-variant mt-1" th:text="#{admin.lead}"></p>
    <div class="inline-flex gap-1 p-1 bg-surface-container rounded-xl mt-4 mb-6">
      <a th:href="@{/admin/schedules}" th:text="#{admin.schedules}"
        th:class="${active == 'schedules'} ? 'vc-btn vc-btn-sm bg-surface-container-lowest text-primary shadow-sm' : 'vc-btn vc-btn-sm text-on-surface-variant'"></a>
      <a th:href="@{/admin/hospitals}" th:text="#{admin.hospitals}"
        th:class="${active == 'hospitals'} ? 'vc-btn vc-btn-sm bg-surface-container-lowest text-primary shadow-sm' : 'vc-btn vc-btn-sm text-on-surface-variant'"></a>
    </div>
  </th:block>
</body>

</html>
