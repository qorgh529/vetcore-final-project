<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'signup')}">

<body>

  <div class="flex flex-col items-center py-8">
    <div class="w-full max-w-[460px] bg-surface-container-lowest rounded-xl shadow-xl p-6 sm:p-8">
      <h1 class="text-headline-sm text-on-surface text-center" th:text="#{signup}"></h1>
      <p class="text-body-md text-on-surface-variant text-center mt-1" th:text="#{signup.lead}"></p>

      <form class="mt-6 space-y-4" th:object="${signupForm}" th:action="@{/signup}" method="post" id="signup-form">
        <div>
          <label class="vc-label" for="username" th:text="#{username}"></label>
          <input class="vc-input" type="text" th:field="*{username}" autocomplete="username" />
          <span class="vc-field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
        </div>
        <div>
          <label class="vc-label" for="password" th:text="#{password}"></label>
          <input class="vc-input" type="password" th:field="*{password}" autocomplete="new-password" />
          <span class="vc-field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        </div>
        <div>
          <label class="vc-label" for="displayName" th:text="#{displayName}"></label>
          <input class="vc-input" type="text" th:field="*{displayName}" maxlength="30" />
          <span class="vc-field-error" th:if="${#fields.hasErrors('displayName')}" th:errors="*{displayName}"></span>
        </div>
        <div class="pt-2">
          <button class="vc-btn-primary w-full h-11 text-title-md" type="submit" th:text="#{signup}"></button>
        </div>
      </form>
    </div>
  </div>

</body>

</html>
