<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'reservations')}">

<body>

  <div class="max-w-2xl mx-auto">
    <h1 class="vc-title mb-6" th:text="${reservationId == null} ? #{newReservation} : #{editReservation}"></h1>

    <div class="vc-card bg-surface-container-low mb-6" id="schedule">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <h2 class="text-title-md text-on-surface" th:text="${schedule.treatmentName}"></h2>
        <span class="vc-badge bg-secondary-container text-on-secondary-container"
          th:text="#{remaining} + ' ' + ${schedule.remaining} + ' / ' + ${schedule.capacity}"></span>
      </div>
      <p class="text-body-lg text-on-surface-variant mt-2">
        <span class="fa fa-hospital-o text-primary w-4" aria-hidden="true"></span>
        <span th:text="${schedule.hospital.name}"></span>
      </p>
      <p class="text-body-lg text-on-surface-variant mt-1">
        <span class="fa fa-calendar text-primary w-4" aria-hidden="true"></span>
        <span th:text="${schedule.treatmentDate + ' ' + schedule.startTime}"></span>
      </p>
    </div>

    <form class="vc-card space-y-4" th:object="${reservationForm}" method="post" id="reservation-form"
      th:action="${reservationId == null} ? @{/reservations} : @{/reservations/{id}(id=${reservationId})}">

      <input type="hidden" th:field="*{scheduleId}" th:if="${reservationId == null}" />

      <div th:if="${reservationId != null}">
        <label class="vc-label" for="scheduleId" th:text="#{changeSchedule}"></label>
        <select class="vc-input" th:field="*{scheduleId}">
          <option th:each="c : ${choices}" th:value="${c.id}"
            th:text="${c.treatmentDate + ' ' + c.startTime + ' · ' + c.hospital.name + ' · ' + c.remaining}"></option>
        </select>
      </div>

      <div>
        <label class="vc-label" for="petName" th:text="#{petName}"></label>
        <input class="vc-input" type="text" th:field="*{petName}" maxlength="30" />
        <span class="vc-field-error" th:if="${#fields.hasErrors('petName')}" th:errors="*{petName}"></span>
      </div>

      <div>
        <label class="vc-label" for="memo" th:text="#{memo}"></label>
        <input class="vc-input" type="text" th:field="*{memo}" maxlength="255" />
        <span class="vc-field-error" th:if="${#fields.hasErrors('memo')}" th:errors="*{memo}"></span>
      </div>

      <div class="flex items-center gap-2 pt-2">
        <button type="submit" class="vc-btn-primary" th:text="${reservationId == null} ? #{reserve} : #{save}"></button>
        <a class="vc-btn-plain" th:href="${reservationId == null} ? @{/schedules} : @{/reservations}" th:text="#{back}"></a>
      </div>
    </form>
  </div>

</body>

</html>
